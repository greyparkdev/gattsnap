# Example: gate a firmware pull request on its committed GATT snapshot.
#
# Copy this into the firmware repository that holds the snapshot. It is not run
# by this repository — the `action` job in `ci.yml` exercises the action against
# fixtures via `scripts/test-action.sh`.

name: GATT contract

# The action reports through workflow commands (annotations on stdout), so it
# needs no write token. Read access is enough to check out and diff.
permissions:
  contents: read

on:
  pull_request:
    # Run on every pull request, not only when the snapshot changes. A snapshot
    # that should have changed and did not is a finding too, and a paths filter
    # would hide exactly that case.
    branches: [main]

jobs:
  gatt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Required. The action reads the base snapshot with `git show`, and a
          # shallow clone does not contain the base commit.
          fetch-depth: 0

      - name: Diff the GATT snapshot
        id: gatt
        uses: greyparkdev/gattsnap@v1
        with:
          snapshot: snapshots/acme-sensor.json
          # Turn this on once every capture in the repository was taken with
          # --include-handles. Handle shifts are the failure that breaks already
          # paired clients while a freshly paired test phone passes.
          diff-handles: false
          fail-on: breaking

      - name: Report
        if: always()
        run: echo "gattsnap ${{ steps.gatt.outputs.exit-code }} — ${{ steps.gatt.outputs.verdict }}"
